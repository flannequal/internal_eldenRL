# This file defines all memory addresses, pointer chains, and offsets.
# This version has been corrected to precisely match the working Cheat Engine scripts.

# Static bases are defined as RVAs (Relative Virtual Addresses) from the module base.
bases_static:
  WorldChrMan: 0x3D65F88
  GameDataMan: 0x3D5DF38
  GameMan: 0x3D69918
  FieldArea: 0x3D691D8
  LockTgtMan: 0x3D6A208
  NetManImp: 0x3D5AE60
  EventFlagMan: 0x3D68448

# Static variables are single values at a fixed RVA from the module base.
static_vars:
  ChrDbgFlags:
    rva: 0x3D661A0
    type: int # Bitmask for debug flags

# Pointers are complex addresses that require walking a pointer chain.
# Each pointer has a 'base' (which must be a name from 'bases_static' or another pointer)
# and a list of 'offsets'.
pointers:
  #intermediate Pointers for nicer structure
  LocalPlayer:
    base: WorldChrMan
    offsets: [0x1E508] 
    type: longlong

  PlayerStatsComponent:
    base: LocalPlayer
    offsets: [0x190, 0x0] 
    type: longlong

  PlayerTransformComponent:
    base: LocalPlayer
    offsets: [0x190, 0x68] 
    type: longlong


  PlayerHP:
    base: PlayerStatsComponent
    offsets: [0x138]
    type: int

  PlayerMaxHP:
    base: PlayerStatsComponent
    offsets: [0x13C]
    type: int

  PlayerSP:
    base: PlayerStatsComponent
    offsets: [0x154]
    type: int

  PlayerMaxSP:
    base: PlayerStatsComponent
    offsets: [0x158]
    type: int

  PlayerMP:
    base: PlayerStatsComponent
    offsets: [0x148]
    type: int

  PlayerMaxMP:
    base: PlayerStatsComponent
    offsets: [0x150]
    type: int

  PlayerGravity:
    base: PlayerTransformComponent
    offsets: [0x1D3]
    type: int

  LastGrace:
    base: GameMan
    offsets: [0xB30]
    type: int
    
  InCutscene:
    base: EventFlagMan
    offsets: [0x28,0x113]
    type: byte

  PlayerAnimation:
    base: LocalPlayer
    offsets: [0x190, 0x80, 0x90]
    type: int

  PlayerAnimationState:
    base: LocalPlayer
    offsets: [0x190, 0x18, 0x8]
    type: byte

  PlayerAnimationOverride:
    base: LocalPlayer
    offsets: [0x190, 0x58, 0x18]
    type: int # -1 for off 0 for idle ;   set to an animation id


teleport:
  xPlayer:
    base: PlayerTransformComponent
    offsets: [0x70]
    type: float
  zPlayer:
    base: PlayerTransformComponent
    offsets: [0x74]
    type: float
  yPlayer:
    base: PlayerTransformComponent
    offsets: [0x78]
    type: float
  
  PlayerAngleCosZ:
    base: PlayerTransformComponent
    offsets: [0x54]
    type: float
  PlayerAngleSinZ:
    base: PlayerTransformComponent
    offsets: [0x5C]
    type: float


  xGlobal:
    base: NetManImp
    offsets: [0x80, 0xE0, 0x80, 0x20, 0x98, 0x28]
    type: float
  zGlobal:
    base: NetManImp
    offsets: [0x80, 0xE0, 0x80, 0x20, 0x98, 0x1C]
    type: float
  yGlobal:
    base: NetManImp
    offsets: [0x80, 0xE0, 0x80, 0x20, 0x98, 0x2C]
    type: float
