# Memory arenas configuration (sample)
# Copy this file to config/memory_arenas.yaml and fill in values for your game version.
# All memory address fields are left empty/null as a starting base.

version: 1
process_name: eldenring.exe

arenas:
  # Example entry – replace placeholders and add more arenas as needed
  - id: 8
    name: Beastman
    map: Farum Azula
    player_spawn:
      x: 0.0
      y: 0.0
      z: 0.0
      rot: 0.0
    camera:
      yaw: 0.0
      pitch: 0.0
    player:
      hp_addr: null            # e.g., 0x12345678
      stam_addr: null          # e.g., 0x12345678
      pos_addr: null           # e.g., 0x12345678
    boss:
      hp_addr: null            # e.g., 0x12345678
      state_addr: null         # e.g., 0x12345678
      ai_state_addr: null      # e.g., 0x12345678
    flags:
      in_combat_addr: null     # e.g., 0x12345678
      loading_addr: null       # e.g., 0x12345678
    second_phase:
      trigger_flag_addr: null  # e.g., 0x12345678
    notes: "Fill addresses for your Elden Ring version; leave numeric spawn as needed."

  # Minimal template for a new arena (duplicate and edit)
  - id: 1
    name: Template Boss
    map: Unknown
    player_spawn: { x: 0.0, y: 0.0, z: 0.0, rot: 0.0 }
    camera: { yaw: 0.0, pitch: 0.0 }
    player: { hp_addr: null, stam_addr: null, pos_addr: null }
    boss: { hp_addr: null, state_addr: null, ai_state_addr: null }
    flags: { in_combat_addr: null, loading_addr: null }
    second_phase: { trigger_flag_addr: null }
    notes: "Use this as a starting point for new bosses."


